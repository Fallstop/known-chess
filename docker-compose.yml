# Backend-only build matching the CapRover deployment (root Dockerfile):
# kc-server (Rust API) with permissive CORS. The frontend deploys separately
# to Cloudflare Pages (see frontend/wrangler.toml).
#
# The book is mounted, not baked in. Generate one into ./data/book.book first:
#   cargo run --release --bin kc-process -- --input <lichess.pgn.zst> --output data/book.book

services:
  known-chess:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      KC_BOOK_PATH: /data/book.book
      # Lichess API token for the "watch the original game" link (optional).
      KC_LICHESS_TOKEN: ${KC_LICHESS_TOKEN:-}
      RUST_LOG: info
    volumes:
      - ./data:/data:ro
    ports:
      - "8080:8080"
