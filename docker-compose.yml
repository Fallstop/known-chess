# Single-container build matching the CapRover deployment (root Dockerfile):
# kc-server (Rust API) and the SvelteKit frontend run together; the frontend is
# the only exposed port and proxies /api to the server internally.
#
# The book is mounted, not baked in. Generate one into ./data/book.book first:
#   cargo run --release --bin kc-process -- --input <lichess.pgn.zst> --output data/book.book

services:
  known-chess:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      KC_BOOK_PATH: /data/book.book
      # Lichess API token for the "watch the original game" link (optional).
      KC_LICHESS_TOKEN: ${KC_LICHESS_TOKEN:-}
      RUST_LOG: info
    volumes:
      - ./data:/data:ro
    ports:
      - "3000:3000"
