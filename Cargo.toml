[workspace]
resolver = "2"
members = ["crates/shared", "crates/processor", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/known-chess/known-chess"

[workspace.dependencies]
# Chess move generation + Zobrist hashing.
shakmaty = { version = "0.27", features = ["alloc"] }
# Streaming PGN parser from the same author as shakmaty.
pgn-reader = "0.26"
# Errors / logging / serde shared across crates.
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

shared = { path = "crates/shared" }

[profile.release]
lto = "thin"
codegen-units = 1
