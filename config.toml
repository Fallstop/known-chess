# known-chess configuration, shared by `kc-process` and `kc-server`.
#
# `kc-process` downloads lichess dumps into [storage].downloads and folds each
# one into the single combined book at [storage].book. `kc-server` reads that
# one book. The dumps merged into it are tracked in <book>.sources so
# `kc-process list` can show what's been processed.

[storage]
# Where downloaded lichess `.pgn.zst` dumps live.
downloads = "/media/fallstop/SCRATCH/Chess"
# The combined book every dump is merged into. Defaults to
# <downloads>/known.book if omitted.
book = "/media/fallstop/SCRATCH/Chess/known.book"

[source]
# The canonical list of available standard-rated monthly dumps.
list_url = "https://database.lichess.org/standard/list.txt"

[server]
# Address kc-server binds to (overridable with the KC_BIND env var).
bind = "0.0.0.0:8080"
# Book to serve. Defaults to [storage].book; set only to serve a different file.
# book = "/media/fallstop/SCRATCH/Chess/known.book"
# Lichess API token (https://lichess.org/account/oauth/token, no scopes needed)
# for /api/identify, which finds the real game behind a played-out line via the
# opening explorer; it requires auth since 2026-03. Without it the frontend
# simply never shows a "watch the original game" link. Prefer the
# KC_LICHESS_TOKEN env var; don't commit a real token here.
# lichess_token = "lip_..."
